<!DOCTYPE html>
<html lang="en" data-theme = "light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chimeral Sea</title>
    <link rel="stylesheet" href="../../styleColor.css">
    <link rel="stylesheet" href="../../styleMain.css">
    <link rel="stylesheet" href="../../styleUnder.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  
  </head>

  <body>

  <!-- TODO: Zooming font sizes-->

  <!-- Main Page w/ exit links -->
  <div class="mainCover">


      <p>Toggle Darkmode: 
      <label class="switch", style = "margin-left: -5px; top: 16px; margin-right: -3px;">
        <input type="checkbox" id = "darkmode-toggle">
        <span class="slider" id = "outer"></span>
        <span class="slider" id = "inner"></span>
         </input> 
      </label></p>
      
  </div>

  <!-- Script elements-->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var checkbox = document.getElementById("darkmode-toggle");

      checkbox.addEventListener('change', function () {
        toggleMode();
      });
    });
    function toggleMode() {
        var checkbox = document.getElementById("darkmode-toggle");
        document.querySelector("html").setAttribute("data-theme", checkbox.checked ? "dark" : "light");
    }

    // For applying on startup
    var checkbox = document.getElementById("darkmode-toggle");
    document.querySelector("html").setAttribute("data-theme", checkbox.checked ? "dark" : "light");
    </script>
</body>

</html>
